# Example service map for the public repository.
# Hosts below are fictitious. Copy this file to private/services.yaml
# and replace example hosts with your real LAN values.

dashboard:
  host: 0.0.0.0
  port: 8000
  refresh_seconds: 10
  timeout_seconds: 5

internet:
  id: internet
  name: Can I Reach the Internet
  urls:
    - https://www.google.com/generate_204
    - https://www.cloudflare.com/cdn-cgi/trace
    - https://1.1.1.1/cdn-cgi/trace
  success_threshold: 2

services:
  - id: lm_studio
    name: Can I see LM Studio
    scheme: http
    host: 10.42.0.10
    port: 1234
    path: /v1/models
    expect_status: 200
  - id: ollama
    name: Can I see the Ollama Server
    scheme: http
    host: 10.42.0.20
    port: 11434
    path: /api/version
    expect_status: 200

# Structured Kuma status + LM Studio summary (not a GET / UI probe).
# Card is up when Kuma data was retrieved and no Critical monitor is currently Down.
# Low historical uptime on an Up monitor does not mark this card Down.
# Primary ingest: public status-page JSON (not HTML, not Prometheus).
uptime_kuma:
  id: uptime_kuma
  name: What is Uptime Kuma reporting?
  scheme: http
  host: 10.42.0.40
  port: 3001
  # Public status page: http://10.42.0.40:3001/status/ping-networkinfrastructure
  # Slug is not an IP; enable Show Tags on that page if Critical tags should affect this card.
  status_page_slug: ping-networkinfrastructure
  lm_studio_model: llama-3.2-8b-instruct
  summarize_timeout_seconds: 8
  summary_cache_seconds: 90
  timeout_seconds: 5

nas:
  id: nas
  name: Can I see my files on my NAS?
  drive: "Z:"
  share: '\\10.42.0.30\shared'
  host: 10.42.0.30
  smb_port: 445
  timeout_seconds: 5
